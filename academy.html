<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>Академия падела — тесты</title>
<link rel="stylesheet" href="app.css">
<style>
  .page { max-width:560px; padding-top:12px; }
  .qtop { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .dots { display:flex; gap:4px; flex:1; }
  .dots button { flex:1; min-width:0; height:30px; padding:0; border:0; background:none; border-radius:6px; position:relative; }
  .dots button::before { content:""; position:absolute; left:1px; right:1px; top:11px; height:8px; border-radius:4px; background:rgba(255,255,255,.14); }
  .dots .g2::before { background:var(--ball); } .dots .g1::before { background:#7fd3ff; } .dots .g0::before { background:var(--b); }
  .dots .now::before { top:7px; height:16px; box-shadow:0 0 0 2px #fff; }
  .pts { font-family:Unbounded; font-weight:900; color:var(--ball); font-size:22px; min-width:48px; text-align:right; }
  .vbtn { width:52px; height:52px; padding:0; border-radius:50%; font-size:22px; flex:none; }
  .kind { font-family:Unbounded; font-size:14px; letter-spacing:1.4px; color:var(--dim); text-transform:uppercase; }
  .q { font-size:clamp(20px, 5.4vw, 25px); font-weight:800; margin:4px 0 12px; line-height:1.3; }
  .courtq { display:flex; justify-content:center; margin-bottom:12px; }
  .courtq svg { height:min(42vh, 400px); width:auto; max-width:100%; border-radius:16px; border:1px solid var(--line); background:#0d2a1b; }
  .opts { display:grid; gap:10px; }
  .opts button { text-align:left; padding:16px; font-size:18px; border-radius:16px; display:flex; gap:12px; align-items:center; }
  .opts button b { font-family:Unbounded; font-size:15px; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.1); flex:none; }
  .opts button.g2 { border-color:var(--ball); background:rgba(215,242,5,.14); }
  .opts button.g1 { border-color:#7fd3ff; background:rgba(127,211,255,.12); }
  .opts button.g0.picked { border-color:var(--b); background:rgba(255,90,95,.16); }
  .opts button:disabled { opacity:1; cursor:default; }
  .opts button.dim { opacity:.45; }
  .verdict { margin-top:12px; border-radius:16px; padding:15px 16px; animation:drop .3s ease-out; }
  .verdict h3 { margin:0 0 4px; font-family:Unbounded; font-size:20px; }
  .verdict p { margin:0; font-size:17.5px; line-height:1.45; }
  .verdict.g2 { background:rgba(215,242,5,.13); border:1px solid var(--ball); } .verdict.g2 h3 { color:var(--ball); }
  .verdict.g1 { background:rgba(127,211,255,.12); border:1px solid #7fd3ff; } .verdict.g1 h3 { color:#7fd3ff; }
  .verdict.g0 { background:rgba(255,90,95,.14); border:1px solid var(--b); } .verdict.g0 h3 { color:#ff9a9d; }
  .verdict .src { display:inline-block; margin-top:10px; color:var(--dim); font-size:16px; font-weight:700; text-decoration:none; }
  .big { width:100%; margin-top:12px; padding:18px; font-size:19px; border-radius:16px; display:block; text-align:center; text-decoration:none; }
  a.big { color:var(--ball); font-weight:800; }
  .final { text-align:center; padding:20px 4px; }
  .final .score { font-family:Unbounded; font-weight:900; font-size:68px; color:var(--ball); line-height:1; margin:8px 0; }
  .final p { color:var(--dim); font-weight:700; font-size:18px; }
  .ch { padding:16px; }
  .ch b { font-size:20px; } .ch .lang { color:#7fd3ff; font-weight:800; font-size:15px; margin-left:8px; }
  .ch p { margin:6px 0 12px; font-size:17px; line-height:1.45; color:#d6e0f3; }
  .ch .row { display:flex; gap:10px; flex-wrap:wrap; }
  .ch .row a, .ch .row button { flex:1 1 40%; padding:14px; font-size:17px; border-radius:14px; text-align:center; text-decoration:none; font-weight:800; }
  .ch .row a { color:var(--text); border:1px solid var(--line); background:rgba(255,255,255,.07); }
</style>
</head>
<body>
<nav class="top">
  <a class="logo" href="index.html"><span class="dot"></span>ПАДЕЛ</a>
  <div class="tabs"><a href="rules.html"><span>📜</span>Правила</a><a href="score.html"><span>🎾</span>Счёт</a><a href="ref.html"><span>📚</span>Справка</a><a href="academy.html" class="on"><span>🎓</span>Академия</a><a href="tournament.html"><span>🏆</span>Турнир</a></div>
</nav>
<main class="page" id="app"></main>

<script src="voice.js"></script>
<script src="tests.js"></script>
<script src="reader.js"></script>
<script>
const GR = { 2:['Отлично!', 1], 1:['Можно', .5], 0:['Ошибка', 0] };
const KEY = 'padel-tests';
// ответы помним по каждому набору: { set: { a:{ номер вопроса: номер ответа }, at: где остановился } }
let store = JSON.parse(localStorage.getItem(KEY) || '{}');
let sect = 'tests', set = Object.keys(SETS)[0], qi = 0, anim = 0, talking = false;
if (SETS[location.hash.slice(1)]) set = location.hash.slice(1);
else if (store.last && SETS[store.last]) set = store.last;
const app = document.getElementById('app');
const Q = () => SETS[set].q;
const mine = () => store[set] || (store[set] = { a:{}, at:0 });
const save = () => { mine().at = qi; store.last = set; localStorage.setItem(KEY, JSON.stringify(store)); };
const grade = i => { const a = mine().a[i]; return a == null ? null : Q()[i].opts[a].g; };
const score = () => Object.keys(mine().a).reduce((s, i) => s + GR[grade(i)][1], 0);
const fmt = n => String(n).replace('.', ',');
qi = Math.min(mine().at || 0, Q().length);

function court(c) {
  const P = (xy, col, lbl, id) => `<g id="${id}" transform="translate(${xy[0]} ${xy[1]})"><circle r="${id === 'pY' ? 12 : 10}" fill="${col}" stroke="${id === 'pY' ? '#d7f205' : '#08111f'}" stroke-width="${id === 'pY' ? 3.5 : 2.5}"/>${lbl ? `<text y="4.5" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="Manrope">${lbl}</text>` : ''}</g>`;
  return `<svg viewBox="-6 -6 212 412" id="cq">
    <defs><linearGradient id="cqg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2a6fd0"/><stop offset=".5" stop-color="#2f7de1"/><stop offset="1" stop-color="#2a6fd0"/></linearGradient></defs>
    <rect x="0" y="0" width="200" height="400" fill="url(#cqg)" stroke="#7fd3ff" stroke-width="4"/>
    <path d="M0 61 H200 M0 339 H200 M100 61 V339" stroke="#fff" stroke-width="1.6" opacity=".85"/>
    <path d="M-4 200 H204" stroke="#fff" stroke-width="4"/>
    <g id="trail"></g>
    ${P(c.p.a, '#ff5a5f', '', 'pA')}${P(c.p.b, '#ff5a5f', '', 'pB')}${P(c.p.m, '#3d8bff', '', 'pM')}${P(c.p.y, '#3d8bff', 'ТЫ', 'pY')}
    <ellipse id="shadow" cx="${c.ball[0]}" cy="${c.ball[1]}" rx="5" ry="3" fill="#000" opacity=".35"/>
    <circle id="ball" cx="${c.ball[0]}" cy="${c.ball[1]}" r="6" fill="#d7f205" stroke="#08111f" stroke-width="1.5"/>
  </svg>`;
}

// полёт мяча (или игрока) по траектории; h — высота дуги. instant — сразу конечная точка (вопрос уже отвечен).
// Листнул во время полёта — anim сменился, анимация тихо бросается.
function fly(segs, who, instant) {
  const tok = ++anim;
  return segs.reduce((pr, sg) => pr.then(() => new Promise(res => {
    if (tok !== anim) return res();
    const ns = 'http://www.w3.org/2000/svg', path = document.createElementNS(ns, 'path');
    path.setAttribute('d', sg.d); path.setAttribute('fill', 'none'); path.setAttribute('stroke', '#d7f205');
    path.setAttribute('stroke-width', '2.5'); path.setAttribute('stroke-dasharray', '5 6'); path.setAttribute('opacity', '.8');
    document.getElementById('trail').appendChild(path);
    const L = path.getTotalLength(), dur = Math.max(450, L * 3.2), t0 = performance.now();
    const ball = document.getElementById('ball'), sh = document.getElementById('shadow'), me = who && document.getElementById('p' + who.toUpperCase());
    (function step(now) {
      if (tok !== anim) return res();
      const t = instant ? 1 : Math.min(1, (now - t0) / dur), pt = path.getPointAtLength(L * t);
      if (who) me.setAttribute('transform', `translate(${pt.x} ${pt.y})`);
      else {
        const lift = Math.sin(Math.PI * t) * (sg.h || 0);
        ball.setAttribute('cx', pt.x); ball.setAttribute('cy', pt.y - lift * 22); ball.setAttribute('r', 6 + lift * 5);
        sh.setAttribute('cx', pt.x); sh.setAttribute('cy', pt.y);
      }
      t < 1 ? requestAnimationFrame(step) : res();
    })(t0);
  })), Promise.resolve());
}

const chips = () => `<div class="chips wrap">${Object.entries(SETS).map(([k, v]) => `<button data-set="${k}" class="${set === k ? 'on' : ''}">${v.name}</button>`).join('')}</div>`;
const qText = c => `${c.k} ${c.q} ${c.opts.map((o, i) => `${'АБВ'[i]}: ${o.t}.`).join(' ')}`;
function verdictText(c, o) {
  const best = c.opts.find(x => x.g === 2);
  return o.g === 2 ? o.r : `${o.r} Лучше: ${best.t.toLowerCase()}.`;
}
function verdictHTML(c, o) {
  return `<div class="verdict g${o.g}"><h3>${GR[o.g][0]}</h3><p>${verdictText(c, o)}</p>${c.src ? `<a class="src" href="https://youtu.be/${c.src}${c.t ? '?t=' + c.t : ''}" target="_blank" rel="noopener">▶ ${VID[c.src]}${c.t ? ` · ${Math.floor(c.t / 60)}:${String(c.t % 60).padStart(2, '0')}` : ''}</a>` : ''}</div>
    <button class="primary big" data-nav="1">${qi + 1 < Q().length ? 'Дальше →' : 'Итог →'}</button>`;
}
// что прочитать по кнопке «Слушать»: вопрос, а если уже ответил — разбор
function speech() {
  if (qi >= Q().length) return finalText();
  const c = Q()[qi], a = mine().a[qi];
  return a == null ? qText(c) : `${GR[c.opts[a].g][0]} ${verdictText(c, c.opts[a])}`;
}
// auto — озвучка сама (по выключателю 🔊); кнопка «Слушать» читает всегда
let sayTok = 0;
function say(text, auto) {
  if (auto && !Voice.on) return;
  const my = ++sayTok;
  talking = true; sayBtn();
  Voice.say(text, { force:true, onend: () => { if (my === sayTok) { talking = false; sayBtn(); } } });
}
function sayBtn() { const b = document.getElementById('say'); if (b) { b.textContent = talking ? '■ Стоп' : '▶ Слушать'; b.classList.toggle('on', talking); } }
function shutUp() { sayTok++; talking = false; Voice.stop(); sayBtn(); }

function render() {
  anim++;
  const sec = `<div class="chips"><button data-sect="tests" class="${sect === 'tests' ? 'on' : ''}">🧠 Тесты</button><button data-sect="channels" class="${sect === 'channels' ? 'on' : ''}">📺 Каналы</button></div>`;
  if (sect === 'channels') return app.innerHTML = sec + channels();
  const N = Q().length;
  const top = `${chips()}
    <div class="qtop"><div class="dots">${Q().map((_, i) => `<button data-go="${i}" aria-label="Вопрос ${i + 1}" class="${grade(i) != null ? 'g' + grade(i) : ''} ${i === qi ? 'now' : ''}"></button>`).join('')}</div>
      <div class="pts">${fmt(score())}</div><button class="vbtn" id="vbtn" aria-label="Авто-озвучка">${Voice.on ? '🔊' : '🔇'}</button></div>
    <div class="bar"><button data-nav="-1" aria-label="Назад" ${qi === 0 ? 'disabled' : ''}>${CHEV(-1)}</button><button class="primary grow" id="say">▶ Слушать</button><button data-nav="1" aria-label="Вперёд" ${qi >= N ? 'disabled' : ''}>${CHEV(1)}</button></div>`;
  if (qi >= N) { app.innerHTML = sec + top + final(); sayBtn(); return; }
  const c = Q()[qi], a = mine().a[qi];
  app.innerHTML = `${sec}${top}
    <div class="kind">${c.k} · ${qi + 1}/${N}</div>
    <div class="q">${c.q}</div>
    <div class="courtq">${court(c)}</div>
    <div class="opts">${c.opts.map((o, i) => `<button data-o="${i}"><b>${'АБВ'[i]}</b>${o.t}</button>`).join('')}</div>
    <div id="after"></div>`;
  sayBtn();
  if (a != null) { showPick(c, a); fly(c.truth || [{ d:c.opts[a].d, h:c.opts[a].h }], c.opts[a].who, true); document.getElementById('after').innerHTML = verdictHTML(c, c.opts[a]); }
  else say(qText(c), true);
}

function showPick(c, i) {
  app.querySelectorAll('.opts button').forEach((b, k) => { b.disabled = true; if (k === i) b.classList.add('picked', 'g' + c.opts[i].g); else if (c.opts[k].g === 2) b.classList.add('g2'); else b.classList.add('dim'); });
}
async function pick(i) {
  const c = Q()[qi], o = c.opts[i], at = qi;
  if (mine().a[qi] != null) return;
  mine().a[qi] = i; save();
  showPick(c, i);
  const dot = app.querySelector(`.dots [data-go="${qi}"]`); dot.classList.add('g' + o.g);
  app.querySelector('.pts').textContent = fmt(score());
  say(`${GR[o.g][0]} ${verdictText(c, o)}`, true);
  const tok = anim + 1;
  await fly(c.truth || [{ d:o.d, h:o.h }], o.who);
  if (tok !== anim || at !== qi) return;   // успел перелистнуть
  document.getElementById('after').innerHTML = verdictHTML(c, o);
  app.querySelector('#after .big').scrollIntoView({ behavior:'smooth', block:'end' });
}

const msgOf = pct => pct >= .85 ? 'Тактик! Можно на турнир.' : pct >= .6 ? 'Крепко. Пара решений — и будет огонь.' : 'Есть над чем поработать — загляни в Справку.';
function finalText() {
  const done = Object.keys(mine().a).length, N = Q().length;
  return done < N ? `Отвечено ${done} из ${N}. Осталось ${N - done}.` : `Результат: ${fmt(score())} из ${N}. ${msgOf(score() / N)}`;
}
function final() {
  const N = Q().length, done = Object.keys(mine().a).length, miss = Q().findIndex((_, i) => mine().a[i] == null);
  setTimeout(() => say(finalText(), true));
  return `<div class="final"><div class="kind">${SETS[set].name}</div><div class="score">${fmt(score())}/${N}</div>
    <p>${done < N ? `Отвечено ${done} из ${N}.` : msgOf(score() / N)}</p>
    ${miss >= 0 ? `<button class="primary big" data-go="${miss}">Ответить на пропущенные (${N - done})</button>` : ''}
    <button class="big" id="again">↺ Пройти заново</button>
    <a class="big" href="ref.html">📚 В Справку →</a></div>`;
}
function channels() {
  return CHANNELS.map(ch => `<article class="card ch"><b>${ch.name}</b><span class="lang">${ch.lang}</span><p>${ch.note}</p>
    <div class="row"><a href="${ch.url}" target="_blank" rel="noopener">▶ Открыть</a>${ch.q ? `<button class="primary" data-set="${ch.q}">🧠 Тесты (${SETS[ch.q].q.length})</button>` : ''}</div></article>`).join('');
}

function go(n) {
  n = Math.max(0, Math.min(Q().length, n));
  if (n === qi && sect === 'tests') return;
  shutUp(); qi = n; save(); render();
  window.scrollTo({ top:0, behavior:'smooth' });
}
app.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.dataset.sect) { shutUp(); sect = t.dataset.sect; return render(); }
  if (t.dataset.set) { shutUp(); sect = 'tests'; set = t.dataset.set; qi = Math.min(mine().at || 0, Q().length); save(); return render(); }
  if (t.dataset.nav) return go(qi + +t.dataset.nav);
  if (t.dataset.go) return go(+t.dataset.go);
  if (t.dataset.o) return pick(+t.dataset.o);
  if (t.id === 'say') return talking ? shutUp() : say(speech());
  if (t.id === 'vbtn') { Voice.on = !Voice.on; t.textContent = Voice.on ? '🔊' : '🔇'; return; }
  if (t.id === 'again') { store[set] = { a:{}, at:0 }; qi = 0; save(); shutUp(); return render(); }
});
// свайп влево/вправо — следующий/предыдущий вопрос (кнопки-чипсы листаются сами, их не трогаем)
let sx = null, sy = 0;
app.addEventListener('touchstart', e => { sx = e.target.closest('.chips') ? null : e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
app.addEventListener('touchend', e => {
  if (sx == null || sect !== 'tests') return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) go(qi + (dx < 0 ? 1 : -1));
});
document.addEventListener('keydown', e => { if (sect === 'tests' && e.key === 'ArrowRight') go(qi + 1); if (sect === 'tests' && e.key === 'ArrowLeft') go(qi - 1); });
render();
</script>
</body>
</html>
