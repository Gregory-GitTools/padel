<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>Академия падела — все удары</title>
<link rel="stylesheet" href="app.css">
<style>
  .page { max-width:760px; margin:0 auto; padding:18px 14px 30px; }
  .hero h1 { font-family:Unbounded, sans-serif; font-weight:900; font-size:clamp(28px, 8vw, 44px); margin:6px 0 4px; line-height:1.05; }
  .hero h1 span { color:var(--ball); }
  .hero p { color:var(--dim); margin:0 0 14px; font-weight:600; }
  .bar { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  .bar .primary { flex:1; padding:14px; font-size:16px; border-radius:14px; }
  .bar button:not(.primary) { padding:14px; font-size:15px; border-radius:14px; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; scrollbar-width:none; margin:0 -14px; padding-left:14px; padding-right:14px; }
  .chips::-webkit-scrollbar { display:none; }
  .chips button { white-space:nowrap; padding:9px 14px; border-radius:999px; font-size:14px; }
  .chips button.on { background:var(--ball); color:#0b1426; border-color:var(--ball); }
  .group { font-family:Unbounded; font-size:13px; letter-spacing:1.4px; color:var(--dim); text-transform:uppercase; margin:20px 0 10px; }
  .shot { border-radius:18px; border:1px solid var(--line); background:var(--card); margin-bottom:10px; overflow:hidden; transition:border-color .2s, box-shadow .2s; }
  .shot.playing { border-color:var(--ball); box-shadow:0 0 0 1px var(--ball), 0 0 28px rgba(215,242,5,.18); }
  .head { display:grid; grid-template-columns:92px 1fr 46px; gap:12px; align-items:center; padding:10px 10px 10px 10px; cursor:pointer; }
  .mini { width:92px; height:46px; border-radius:10px; background:linear-gradient(180deg, #123a63, #0d2a1b); display:block; }
  .t { min-width:0; }
  .t b { display:block; font-size:17px; }
  .t i { font-style:normal; color:var(--dim); font-size:12.5px; font-weight:700; }
  .t .lvl { display:inline-block; font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:999px; margin-left:6px; vertical-align:1px; }
  .lvl.l1 { background:rgba(143,227,154,.18); color:#8fe39a; } .lvl.l2 { background:rgba(127,211,255,.18); color:#7fd3ff; } .lvl.l3 { background:rgba(255,90,95,.2); color:#ff9a9d; }
  .t .one { display:block; color:#d6e0f3; font-size:14px; margin-top:2px; }
  .spk { width:46px; height:46px; border-radius:50%; font-size:19px; padding:0; }
  .body { display:none; padding:0 14px 14px; }
  .shot.open .body { display:block; animation:drop .25s ease-out; }
  .row3 { display:grid; gap:8px; }
  .row3 div { border-radius:12px; padding:10px 12px; background:rgba(255,255,255,.04); font-size:14.5px; line-height:1.45; }
  .row3 div::before { display:block; font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; margin-bottom:2px; }
  .row3 .w::before { content:"Когда"; color:#7fd3ff; }
  .row3 .k::before { content:"Фишка"; color:var(--ball); }
  .row3 .e::before { content:"Не надо"; color:#ff9a9d; }
  .more { display:inline-block; margin-top:10px; color:var(--ball); font-weight:800; text-decoration:none; font-size:14px; }
</style>
</head>
<body>
<nav class="top">
  <div class="logo"><span class="dot"></span>ПАДЕЛ</div>
  <div class="tabs"><a href="academy.html" class="on"><span>🎓</span>Академия</a><a href="quiz.html"><span>🧠</span>Тест</a><a href="score.html"><span>🎾</span>Счёт</a><a href="tournament.html"><span>🏆</span>Турнир</a><a href="index.html"><span>📖</span>Комикс</a></div>
</nav>
<main class="page">
  <section class="hero">
    <h1>Все удары <span>падела</span></h1>
    <p id="count"></p>
  </section>
  <div class="bar">
    <button class="primary" id="playAll">▶ Слушать подряд</button>
    <button id="rateBtn">1×</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</main>

<script src="voice.js"></script>
<script>
// Мини-схемы сбоку: слева наше стекло, сетка посередине, справа стекло соперника
const PATHS = {
  serve:   ['M30 58 Q62 30 100 44 Q130 56 150 70'],
  drive:   ['M30 50 Q95 32 172 64'],
  lob:     ['M30 56 Q110 -28 186 60'],
  chiq:    ['M30 60 Q78 36 128 70'],
  volley:  ['M80 40 Q122 38 160 70'],
  drop:    ['M80 44 Q100 32 112 70'],
  block:   ['M70 66 Q100 44 142 70'],
  bandeja: ['M44 18 Q122 18 176 70'],
  vibora:  ['M44 22 Q118 34 168 70'],
  smash:   ['M42 12 L150 70'],
  out3:    ['M42 12 L168 70 Q186 34 200 14'],
  out4:    ['M42 12 L160 70 Q178 40 200 40'],
  rulo:    ['M42 12 L166 70 Q184 26 194 36'],
  wall:    ['M150 22 Q60 40 6 66 Q12 44 4 30', 'M34 50 Q112 -14 186 60'],
  bajada:  ['M150 4 Q40 16 4 36', 'M40 20 L162 70'],
  contra:  ['M40 50 L5 26 Q84 -22 172 66'],
  clob:    ['M86 32 Q136 -22 190 56'],
};
const SHOTS = [
  // [id, группа, название, по-испански, уровень, мини-схема, одной фразой, когда, фишка, не надо, ссылка на комикс]
  ['saque', 'serve', 'Подача', 'saque', 1, 'serve', 'Снизу, после отскока, по диагонали.', 'Начало каждого очка.', 'Целься в угол у стекла или в «Т». Подал — беги к сетке.', 'Бить выше пояса.', 'serve'],
  ['resto', 'serve', 'Приём', 'resto', 1, 'drive', 'Ответ на подачу.', 'Подающий бежит к сетке.', 'Низко в ноги бегущему или свеча.', 'Лупить в стекло — вернётся.'],
  ['derecha', 'back', 'Справа', 'derecha', 1, 'drive', 'Основной удар сзади.', 'Мяч после отскока, сбоку справа.', 'Короткий замах, мяч перед собой.', 'Теннисный замах «от уха».', 'drive'],
  ['reves', 'back', 'Слева', 'revés', 1, 'drive', 'То же слева, одной рукой.', 'Мяч слева после отскока.', 'С подрезкой — надёжнее.', 'Бить мяч, ушедший за спину.', 'backhand'],
  ['globo', 'back', 'Свеча', 'globo', 1, 'lob', 'Высоко за спину сеточникам.', 'Соперники у сетки, ты в защите.', 'Над левым плечом соперника. Сыграл — оба к сетке.', 'Короткая свеча = смэш в тебя.', 'lob'],
  ['chiquita', 'back', 'Чикита', 'chiquita', 2, 'chiq', 'Мягко в ноги сеточникам.', 'Свечу не сыграть, а атаковать нечем.', 'Медленно и низко — пусть бьют снизу вверх.', 'Высокая чикита — подарок.', 'chiquita'],
  ['passing', 'back', 'Обводка', 'passing', 2, 'drive', 'Мимо сеточника вдоль боковой.', 'Сеточник прилип к центру.', 'Только с удобного мяча.', 'Пытаться с каждого мяча.'],
  ['contraglobo', 'back', 'Ответная свеча', 'contraglobo', 3, 'clob', 'Свеча в ответ на свечу.', 'Тебя перекинули, бежишь назад.', 'Выиграть время и вернуть позицию.', 'Бить сильно на бегу.'],
  ['volea-d', 'net', 'Воле справа', 'volea de derecha', 1, 'volley', 'С лёта у сетки, справа.', 'Ты у сетки, мяч летит на тебя.', 'Без замаха, от плеча, в ноги.', 'Замахиваться.', 'volley'],
  ['volea-r', 'net', 'Воле слева', 'volea de revés', 1, 'volley', 'С лёта у сетки, слева.', 'Мяч в левую сторону у сетки.', 'Ракетка перед грудью всегда.', 'Опускать головку ракетки.', 'volley'],
  ['dejada', 'net', 'Укороченный', 'dejada', 2, 'drop', 'Мяч умирает у сетки.', 'Соперники далеко у стекла.', 'Гаси скорость, мяч едва перелетает.', 'Когда соперник рядом.'],
  ['bloqueo', 'net', 'Блок с полулёта', 'bote pronto', 2, 'block', 'Сразу после отскока у ног.', 'Мяч прилетел в ноги у сетки.', 'Ракетка неподвижна, просто подставь.', 'Махать по мячу.'],
  ['bandeja', 'over', 'Бандеха', 'bandeja', 2, 'bandeja', 'Контроль над головой — держим сетку.', 'Свеча, но ты успел.', 'Сбоку, с подрезкой, в угол. И снова к сетке.', 'Пытаться убить мяч.', 'bandeja'],
  ['vibora', 'over', 'Вибора', 'víbora', 3, 'vibora', 'Злая бандеха с боковым вращением.', 'Мяч чуть ниже, ты устойчив.', 'Мяч липнет к боковому стеклу.', 'С неудобного мяча.', 'vibora'],
  ['remate', 'over', 'Смэш', 'remate', 2, 'smash', 'Добивание — в пол.', 'Короткая свеча у сетки.', 'Между соперниками или в ноги.', 'Смэш с задней линии.', 'smash'],
  ['x3', 'over', 'Смэш «по 3»', 'por tres', 3, 'out3', 'Мяч вылетает за заднюю стенку.', 'Высокий мяч у сетки, есть сила.', 'Мощно в пол у задней линии соперника.', 'Если не уверен — бандеха.', 'smash'],
  ['x4', 'over', 'Смэш «по 4»', 'por cuatro', 3, 'out4', 'Мяч вылетает вбок через дверь.', 'Мяч ближе к боковой стенке.', 'Наискосок, к боковому стеклу.', 'Когда двери закрыты/нет выхода.', 'smash'],
  ['rulo', 'over', 'Рульо', 'rulo', 3, 'rulo', 'Смэш с верхним вращением.', 'Высокий мяч, хочешь неудобный отскок.', 'Мяч высоко прыгает от стекла.', 'Путать с силовым смэшем.'],
  ['gancho', 'over', 'Ганчо', 'gancho', 3, 'bandeja', 'Крюк над головой слева.', 'Свеча ушла за левое плечо.', 'Вместо бэкхенда над головой.', 'Бить, отступая спиной.'],
  ['pared', 'wall', 'Выход с заднего стекла', 'salida de pared', 1, 'wall', 'Ждём отскок от стекла и бьём.', 'Мяч прошёл мимо и летит в стекло.', 'Иди вместе с мячом, бей перед собой.', 'Прижиматься к стеклу.', 'wall'],
  ['lateral', 'wall', 'Выход с боковой', 'pared lateral', 2, 'wall', 'Мяч отскочил от бокового стекла.', 'Мяч у боковой стенки.', 'Стой подальше — мяч выйдет к тебе.', 'Бежать к стенке.'],
  ['doble', 'wall', 'Двойная стенка', 'doble pared', 3, 'wall', 'Мяч от двух стёкол подряд.', 'Угол корта.', 'Читай угол заранее, мяч замедляется.', 'Стоять в углу.'],
  ['bajada', 'wall', 'Бахада', 'bajada de pared', 3, 'bajada', 'Сверху после отскока от стекла.', 'Высокий мяч вышел от заднего стекла.', 'Защита превращается в атаку.', 'Бить у самого стекла.', 'bajada'],
  ['contrapared', 'wall', 'Контрпаред', 'contrapared', 3, 'contra', 'Бьёшь в своё стекло — мяч перелетает.', 'Последний шанс, мяч прошёл.', 'Сильно вверх в стекло.', 'Делать это без нужды.'],
];
const GROUPS = { serve:'Подача и приём', back:'Сзади', net:'У сетки', over:'Над головой', wall:'Со стенками' };
const LVL = ['', 'база', 'средний', 'продвинутый'];
let filter = 'all', playing = -1;
const $ = id => document.getElementById(id);

function mini(type) {
  const p = PATHS[type];
  return `<svg class="mini" viewBox="0 0 200 80" aria-hidden="true">
    <rect x="0" y="70" width="200" height="10" fill="#2f7de1"/><path d="M0 70 H200" stroke="#cfe8ff" stroke-width="2"/>
    <path d="M4 70 V24 M196 70 V24" stroke="#7fd3ff" stroke-width="4" opacity=".7"/>
    <path d="M100 70 V50" stroke="#fff" stroke-width="3"/>
    ${p.map((d, i) => `<path d="${d}" fill="none" stroke="#d7f205" stroke-width="3.5" stroke-linecap="round" ${i < p.length - 1 ? 'stroke-dasharray="5 6" opacity=".6"' : ''}/>`).join('')}
  </svg>`;
}
const textOf = s => `${s[2]}. ${s[6]} Когда: ${s[7]} Фишка: ${s[8]} Не надо: ${s[9]}`;
const visible = () => SHOTS.map((s, i) => i).filter(i => filter === 'all' || SHOTS[i][1] === filter);

function render() {
  $('count').textContent = `${SHOTS.length} ударов — коротко, с озвучкой. Нажми на удар, чтобы раскрыть.`;
  $('chips').innerHTML = [['all', 'Все'], ...Object.entries(GROUPS)].map(([k, n]) => `<button class="${filter === k ? 'on' : ''}" data-f="${k}">${n}</button>`).join('');
  let h = '', last = '';
  for (const i of visible()) {
    const s = SHOTS[i];
    if (s[1] !== last) { h += `<div class="group">${GROUPS[s[1]]}</div>`; last = s[1]; }
    h += `<article class="shot" id="s${i}" data-i="${i}">
      <div class="head">${mini(s[5])}
        <div class="t"><b>${s[2]}</b><i>${s[3]}</i><span class="lvl l${s[4]}">${LVL[s[4]]}</span><span class="one">${s[6]}</span></div>
        <button class="spk" data-say="${i}" aria-label="Озвучить">🔊</button></div>
      <div class="body"><div class="row3"><div class="w">${s[7]}</div><div class="k">${s[8]}</div><div class="e">${s[9]}</div></div>
        ${s[10] ? `<a class="more" href="index.html#${s[10]}">Комикс по кадрам →</a>` : ''}</div></article>`;
  }
  $('list').innerHTML = h;
  $('rateBtn').textContent = (Voice.rate === 1.05 ? 1 : Voice.rate) + '×';
}

function mark(i) {
  document.querySelectorAll('.shot.playing').forEach(x => x.classList.remove('playing'));
  const el = $('s' + i);
  if (el) { el.classList.add('playing', 'open'); el.scrollIntoView({ behavior:'smooth', block:'center' }); }
}
function stopAll() { playing = -1; Voice.stop(); $('playAll').textContent = '▶ Слушать подряд'; document.querySelectorAll('.shot.playing').forEach(x => x.classList.remove('playing')); }
function playFrom(k) {
  const list = visible();
  if (k >= list.length) return stopAll();
  playing = k; mark(list[k]);
  $('playAll').textContent = '■ Стоп';
  Voice.say(textOf(SHOTS[list[k]]), { force:true, onend: () => { if (playing === k) setTimeout(() => playing === k && playFrom(k + 1), 600); } });
}

$('chips').onclick = e => { const b = e.target.closest('[data-f]'); if (b) { stopAll(); filter = b.dataset.f; render(); } };
$('list').onclick = e => {
  const sp = e.target.closest('[data-say]');
  if (sp) { stopAll(); const i = +sp.dataset.say; mark(i); Voice.say(textOf(SHOTS[i]), { force:true, onend: () => $('s' + i)?.classList.remove('playing') }); return; }
  const card = e.target.closest('.head');
  if (card) card.parentElement.classList.toggle('open');
};
$('playAll').onclick = () => playing >= 0 ? stopAll() : playFrom(0);
$('rateBtn').onclick = () => { const r = [1.05, 1.3, 0.9]; Voice.rate = r[(r.indexOf(Voice.rate) + 1) % r.length]; render(); };
if (!Voice.supported) $('playAll').disabled = true;
render();
</script>
</body>
</html>
