<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>Падел — тест «Что играть?»</title>
<link rel="stylesheet" href="app.css">
<style>
  .page { max-width:560px; margin:0 auto; padding:14px 14px 30px; }
  .qtop { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .dots { display:flex; gap:5px; flex:1; }
  .dots i { flex:1; height:6px; border-radius:3px; background:rgba(255,255,255,.12); }
  .dots i.g2 { background:var(--ball); } .dots i.g1 { background:#7fd3ff; } .dots i.g0 { background:var(--b); } .dots i.now { background:#fff; }
  .pts { font-family:Unbounded; font-weight:900; color:var(--ball); font-size:18px; min-width:44px; text-align:right; }
  .kind { font-family:Unbounded; font-size:12px; letter-spacing:1.4px; color:var(--dim); text-transform:uppercase; }
  .q { font-size:clamp(19px, 5vw, 23px); font-weight:800; margin:4px 0 12px; line-height:1.3; }
  .courtq { display:flex; justify-content:center; margin-bottom:12px; }
  .courtq svg { height:min(46vh, 430px); width:auto; max-width:100%; border-radius:16px; border:1px solid var(--line); background:#0d2a1b; }
  .opts { display:grid; gap:9px; }
  .opts button { text-align:left; padding:15px 16px; font-size:16.5px; border-radius:14px; display:flex; gap:12px; align-items:center; }
  .opts button b { font-family:Unbounded; font-size:13px; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.1); flex:none; }
  .opts button.g2 { border-color:var(--ball); background:rgba(215,242,5,.14); }
  .opts button.g1 { border-color:#7fd3ff; background:rgba(127,211,255,.12); }
  .opts button.g0.picked { border-color:var(--b); background:rgba(255,90,95,.16); }
  .opts button:disabled { opacity:1; cursor:default; }
  .opts button.dim { opacity:.45; }
  .verdict { margin-top:12px; border-radius:16px; padding:14px 16px; animation:drop .3s ease-out; }
  .verdict h3 { margin:0 0 4px; font-family:Unbounded; font-size:18px; }
  .verdict p { margin:0; font-size:15.5px; line-height:1.45; }
  .verdict.g2 { background:rgba(215,242,5,.13); border:1px solid var(--ball); } .verdict.g2 h3 { color:var(--ball); }
  .verdict.g1 { background:rgba(127,211,255,.12); border:1px solid #7fd3ff; } .verdict.g1 h3 { color:#7fd3ff; }
  .verdict.g0 { background:rgba(255,90,95,.14); border:1px solid var(--b); } .verdict.g0 h3 { color:#ff9a9d; }
  .nextq { width:100%; margin-top:12px; padding:16px; font-size:17px; border-radius:14px; }
  .final { text-align:center; padding:30px 10px; }
  .final .big { font-family:Unbounded; font-weight:900; font-size:64px; color:var(--ball); line-height:1; }
  .final p { color:var(--dim); font-weight:700; }
  .vbtn { padding:8px 12px; border-radius:999px; font-size:15px; }
</style>
</head>
<body>
<nav class="top">
  <div class="logo"><span class="dot"></span>ПАДЕЛ</div>
  <div class="tabs"><a href="academy.html"><span>🎓</span>Академия</a><a href="quiz.html" class="on"><span>🧠</span>Тест</a><a href="score.html"><span>🎾</span>Счёт</a><a href="tournament.html"><span>🏆</span>Турнир</a><a href="index.html"><span>📖</span>Комикс</a></div>
</nav>
<main class="page" id="app"></main>

<script src="voice.js"></script>
<script>
// Корт сверху, вертикально: наша половина внизу. 20 px = 1 м, сетка y=200.
// p — расстановка: y — ты, m — партнёр, a/b — соперники; ball — мяч.
// opts: t — ответ, g — оценка (2 лучший, 1 можно, 0 ошибка), d — полёт мяча, h — высота дуги, r — что будет.
// truth — что произойдёт на самом деле (для вопросов «Что будет?»), who:'y' — двигается игрок, а не мяч.
const Q = [
  { k:'Что играть?', q:'Соперники у сетки. К тебе низкий удобный мяч.',
    p:{ y:[70,360], m:[150,360], a:[60,150], b:[140,150] }, ball:[78,345],
    opts:[ { t:'Сильно в центр', g:0, d:'M78 345 L100 160', h:.2, r:'Сеточник ловит с лёта и добивает. Сила против сетки проигрывает.' },
           { t:'Свеча над левым плечом', g:2, d:'M78 345 L168 25', h:1.7, r:'Пролетает над ними к стеклу. Бежим к сетке — она наша.' },
           { t:'Чикита в ноги', g:1, d:'M78 345 L96 178', h:.35, r:'Тоже работает: им бить снизу. Но сетку не забрали.' } ] },
  { k:'Что играть?', q:'Ты у сетки. Свеча — высоко, но уходит за голову.',
    p:{ y:[70,255], m:[140,250], a:[60,40], b:[150,45] }, ball:[66,288],
    opts:[ { t:'Смэш изо всех сил', g:0, d:'M66 288 L100 6 L104 70', h:.3, r:'Мяч отскочит от стекла прямо к ним. И сетку потеряешь.' },
           { t:'Бандеха в угол', g:2, d:'M66 288 L172 14', h:.6, r:'Глубоко в угол, низкий отскок. Ты остаёшься у сетки.' },
           { t:'Убежать назад и отбить', g:1, d:'M66 288 L100 110', h:1.1, r:'Можно, если мяч совсем неудобный. Но сетку отдал.' } ] },
  { k:'Что играть?', q:'Короткая свеча. Мяч высоко прямо перед тобой.',
    p:{ y:[80,252], m:[150,256], a:[60,60], b:[150,60] }, ball:[86,232],
    opts:[ { t:'Смэш в пол между ними', g:2, d:'M86 232 L104 75', h:.2, r:'Очко. А с силой — и «по 3» за стенку.' },
           { t:'Бандеха', g:1, d:'M86 232 L162 18', h:.6, r:'Безопасно, но шанс упущен.' },
           { t:'Чикита', g:0, d:'M86 232 L96 184', h:.3, r:'Зачем? Ты у сетки и мяч высокий — добивай.' } ] },
  { k:'Что играть?', q:'Свеча перелетела тебя и летит в заднее стекло.',
    p:{ y:[70,262], m:[148,300], a:[60,150], b:[140,150] }, ball:[62,385],
    opts:[ { t:'Бежать к стеклу, бить до отскока от него', g:0, d:'M62 385 L90 200', h:.2, r:'Ты зажат у стекла — слабый мяч прямо сеточнику.' },
           { t:'Дать отскочить от стекла и сыграть свечу', g:2, d:'M62 385 L66 340 L150 22', h:1.6, r:'Стекло вернуло мяч, бьёшь спокойно. Свеча — и ты снова в игре.' },
           { t:'Ничего — это аут', g:0, d:'M62 385 L62 398', h:0, r:'Мяч от стекла в игре! Очко соперникам.' } ] },
  { k:'Что играть?', q:'Один соперник у сетки, второй застрял посередине.',
    p:{ y:[70,360], m:[150,360], a:[60,150], b:[150,100] }, ball:[78,345],
    opts:[ { t:'В ноги тому, кто застрял', g:2, d:'M78 345 L150 112', h:.3, r:'Ему неудобно: ни с лёта, ни после отскока.' },
           { t:'В сеточника', g:0, d:'M78 345 L62 162', h:.2, r:'Он ловит и добивает.' },
           { t:'Свеча', g:1, d:'M78 345 L128 25', h:1.5, r:'Можно. Но лучше наказать того, кто встал неправильно.' } ] },
  { k:'Что играть?', q:'Сеточник прилип к центру. У тебя удобный мяч справа.',
    p:{ y:[150,355], m:[60,360], a:[100,150], b:[55,45] }, ball:[150,340],
    opts:[ { t:'Обводка вдоль боковой', g:2, d:'M150 340 L190 20', h:.2, r:'Мимо сеточника — не дотягивается.' },
           { t:'В центр', g:0, d:'M150 340 L102 162', h:.2, r:'Прямо в ракетку сеточнику.' },
           { t:'Свеча', g:1, d:'M150 340 L150 22', h:1.6, r:'Нормально, но обводка тут сильнее.' } ] },
  { k:'Что будет?', q:'Ты сыграл свечу, но короткую — на середину их половины.',
    p:{ y:[70,360], m:[150,360], a:[60,150], b:[140,150] }, ball:[78,345],
    truth:[ { d:'M78 345 L100 112', h:1.2 }, { d:'M100 112 L82 360', h:.1 } ],
    opts:[ { t:'Соперники отступят назад', g:0, r:'Не отступят — мяч им удобен.' },
           { t:'Получу смэш', g:2, r:'Да. Короткая свеча — подарок для смэша.' },
           { t:'Мяч уйдёт в аут', g:0, r:'Нет, он в корте и высоко — идеально для них.' } ] },
  { k:'Что будет?', q:'Соперники сзади. Ты лупишь со всей силы в их заднее стекло.',
    p:{ y:[70,360], m:[150,360], a:[60,40], b:[150,40] }, ball:[78,345],
    truth:[ { d:'M78 345 L112 4', h:.25 }, { d:'M112 4 L108 70', h:.3 } ],
    opts:[ { t:'Очко — не успеют', g:0, r:'Успеют: стекло само вернёт им мяч.' },
           { t:'Стекло вернёт мяч им прямо в удобную зону', g:2, r:'Да. Сила в стекло = удобный мяч сопернику.' },
           { t:'Мяч вылетит за корт', g:0, r:'Нет, «по 3» бывает только после смэша в пол.' } ] },
  { k:'Что делать?', q:'Ты только что подал. Дальше?',
    p:{ y:[140,392], m:[60,250], a:[55,40], b:[140,150] }, ball:[66,120],
    opts:[ { t:'Остаться сзади', g:0, who:'y', d:'M140 392 L140 380', r:'Подарил сетку соперникам.' },
           { t:'Бежать к сетке', g:2, who:'y', d:'M140 392 L140 255', r:'Подача — это пропуск к сетке. Бегом!' },
           { t:'Встать в центр корта', g:0, who:'y', d:'M140 392 L140 320', r:'«Ничья земля»: мяч в ноги — и всё.' } ] },
  { k:'Что играть?', q:'Ты у сетки. Соперник сыграл чикиту тебе в ноги.',
    p:{ y:[80,252], m:[150,256], a:[60,370-300], b:[150,70] }, ball:[86,236],
    opts:[ { t:'Сильно вниз', g:0, d:'M86 236 L94 203', h:.1, r:'Снизу вверх сильно не ударишь — сетка или аут.' },
           { t:'Мягко поднять глубоко', g:2, d:'M86 236 L140 40', h:.6, r:'Мягко, глубоко — держишь сетку и ждёшь удобный мяч.' },
           { t:'Пропустить', g:0, d:'M86 236 L82 330', h:.1, r:'Мяч остался на твоей половине — очко им.' } ] },
];
const GR = { 2:['Отлично!', 1], 1:['Можно', .5], 0:['Ошибка', 0] };
let qi = 0, score = 0, answers = [], busy = false;
const app = document.getElementById('app');

function court(c) {
  const P = (xy, col, lbl, id) => `<g id="${id}" transform="translate(${xy[0]} ${xy[1]})"><circle r="${id === 'pY' ? 12 : 10}" fill="${col}" stroke="${id === 'pY' ? '#d7f205' : '#08111f'}" stroke-width="${id === 'pY' ? 3.5 : 2.5}"/>${lbl ? `<text y="4.5" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="Manrope">${lbl}</text>` : ''}</g>`;
  return `<svg viewBox="-6 -6 212 412" id="cq">
    <defs><linearGradient id="cqg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2a6fd0"/><stop offset=".5" stop-color="#2f7de1"/><stop offset="1" stop-color="#2a6fd0"/></linearGradient></defs>
    <rect x="0" y="0" width="200" height="400" fill="url(#cqg)" stroke="#7fd3ff" stroke-width="4"/>
    <path d="M0 61 H200 M0 339 H200 M100 61 V339" stroke="#fff" stroke-width="1.6" opacity=".85"/>
    <path d="M-4 200 H204" stroke="#fff" stroke-width="4"/>
    <g id="trail"></g>
    ${P(c.p.a, '#ff5a5f', '', 'pA')}${P(c.p.b, '#ff5a5f', '', 'pB')}${P(c.p.m, '#3d8bff', '', 'pM')}${P(c.p.y, '#3d8bff', 'ТЫ', 'pY')}
    <ellipse id="shadow" cx="${c.ball[0]}" cy="${c.ball[1]}" rx="5" ry="3" fill="#000" opacity=".35"/>
    <circle id="ball" cx="${c.ball[0]}" cy="${c.ball[1]}" r="6" fill="#d7f205" stroke="#08111f" stroke-width="1.5"/>
  </svg>`;
}

function render() {
  if (qi >= Q.length) return final();
  const c = Q[qi];
  app.innerHTML = `<div class="qtop"><div class="dots">${Q.map((_, i) => `<i class="${i < answers.length ? 'g' + answers[i] : i === qi ? 'now' : ''}"></i>`).join('')}</div>
      <div class="pts">${score}</div><button class="vbtn" id="vbtn">${Voice.on ? '🔊' : '🔇'}</button></div>
    <div class="kind">${c.k} · ${qi + 1}/${Q.length}</div>
    <div class="q">${c.q}</div>
    <div class="courtq">${court(c)}</div>
    <div class="opts">${c.opts.map((o, i) => `<button data-o="${i}"><b>${'АБВ'[i]}</b>${o.t}</button>`).join('')}</div>
    <div id="after"></div>`;
  document.getElementById('vbtn').onclick = () => { Voice.on = !Voice.on; render(); };
  app.querySelector('.opts').onclick = e => { const b = e.target.closest('[data-o]'); if (b && !busy) pick(+b.dataset.o); };
  Voice.say(`${c.k} ${c.q} ${c.opts.map((o, i) => `${'АБВ'[i]}: ${o.t}.`).join(' ')}`);
}

// анимация мяча (или игрока) по траектории; h — высота дуги: мяч растёт, тень остаётся на полу
function fly(segs, who) {
  return segs.reduce((pr, sg) => pr.then(() => new Promise(res => {
    const svg = document.getElementById('cq'), ns = 'http://www.w3.org/2000/svg';
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', sg.d); path.setAttribute('fill', 'none'); path.setAttribute('stroke', '#d7f205');
    path.setAttribute('stroke-width', '2.5'); path.setAttribute('stroke-dasharray', '5 6'); path.setAttribute('opacity', '.8');
    document.getElementById('trail').appendChild(path);
    const L = path.getTotalLength(), dur = Math.max(450, L * 3.2), t0 = performance.now();
    const ball = document.getElementById('ball'), sh = document.getElementById('shadow'), me = document.getElementById('pY');
    (function step(now) {
      const t = Math.min(1, (now - t0) / dur), pt = path.getPointAtLength(L * t);
      if (who === 'y') me.setAttribute('transform', `translate(${pt.x} ${pt.y})`);
      else {
        const lift = Math.sin(Math.PI * t) * (sg.h || 0);
        ball.setAttribute('cx', pt.x); ball.setAttribute('cy', pt.y - lift * 22); ball.setAttribute('r', 6 + lift * 5);
        sh.setAttribute('cx', pt.x); sh.setAttribute('cy', pt.y);
      }
      t < 1 ? requestAnimationFrame(step) : res();
    })(t0);
  })), Promise.resolve());
}

async function pick(i) {
  busy = true;
  const c = Q[qi], o = c.opts[i];
  const btns = [...app.querySelectorAll('.opts button')];
  btns.forEach((b, k) => { b.disabled = true; if (k === i) b.classList.add('picked', 'g' + o.g); else if (c.opts[k].g === 2) b.classList.add('g2'); else b.classList.add('dim'); });
  answers.push(o.g); score += GR[o.g][1];
  const best = c.opts.find(x => x.g === 2);
  const text = o.g === 2 ? o.r : `${o.r} Лучше: ${best.t.toLowerCase()}.`;
  Voice.say(`${GR[o.g][0]} ${text}`);
  await fly(c.truth || [{ d:o.d, h:o.h }], o.who);
  document.getElementById('after').innerHTML = `<div class="verdict g${o.g}"><h3>${GR[o.g][0]}</h3><p>${text}</p></div>
    <button class="primary nextq" id="nextq">${qi + 1 < Q.length ? 'Дальше →' : 'Итог'}</button>`;
  document.querySelector('.qtop .pts').textContent = score;
  document.getElementById('nextq').onclick = () => { qi++; busy = false; render(); window.scrollTo({ top:0, behavior:'smooth' }); };
  document.getElementById('nextq').scrollIntoView({ behavior:'smooth', block:'end' });
}

function final() {
  const max = Q.length, pct = score / max;
  const msg = pct >= .85 ? 'Тактик! Можно на турнир.' : pct >= .6 ? 'Крепко. Пара решений — и будет огонь.' : 'Есть над чем поработать — загляни в Академию.';
  app.innerHTML = `<div class="final"><div class="kind">Твой результат</div><div class="big">${score}/${max}</div><p>${msg}</p>
    <div class="dots" style="margin:18px 0">${answers.map(g => `<i class="g${g}"></i>`).join('')}</div>
    <button class="primary nextq" id="again">Ещё раз</button><a class="nextq" href="academy.html" style="display:block;text-align:center;color:var(--ball);font-weight:800;text-decoration:none">В Академию →</a></div>`;
  Voice.say(`Результат: ${String(score).replace('.', ',')} из ${max}. ${msg}`);
  document.getElementById('again').onclick = () => { qi = 0; score = 0; answers = []; busy = false; render(); };
}
render();
</script>
</body>
</html>
