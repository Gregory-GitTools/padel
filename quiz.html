  const P = (xy, col, lbl, id) => `<g id="${id}" transform="translate(${xy[0]} ${xy[1]})"><circle r="${id === 'pY' ? 12 : 10}" fill="${col}" stroke="${id === 'pY' ? '#d7f205' : '#08111f'}" stroke-width="${id === 'pY' ? 3.5 : 2.5}"/>${lbl ? `<text y="4.5" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="Manrope">${lbl}</text>` : ''}</g>`;
  return `<svg viewBox="-6 -6 212 412" id="cq">
    <defs><linearGradient id="cqg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2a6fd0"/><stop offset=".5" stop-color="#2f7de1"/><stop offset="1" stop-color="#2a6fd0"/></linearGradient></defs>
    <rect x="0" y="0" width="200" height="400" fill="url(#cqg)" stroke="#7fd3ff" stroke-width="4"/>
    <path d="M0 61 H200 M0 339 H200 M100 61 V339" stroke="#fff" stroke-width="1.6" opacity=".85"/>
    <path d="M-4 200 H204" stroke="#fff" stroke-width="4"/>
    <g id="trail"></g>
    ${P(c.p.a, '#ff5a5f', '', 'pA')}${P(c.p.b, '#ff5a5f', '', 'pB')}${P(c.p.m, '#3d8bff', '', 'pM')}${P(c.p.y, '#3d8bff', 'ТЫ', 'pY')}
    <ellipse id="shadow" cx="${c.ball[0]}" cy="${c.ball[1]}" rx="5" ry="3" fill="#000" opacity=".35"/>
    <circle id="ball" cx="${c.ball[0]}" cy="${c.ball[1]}" r="6" fill="#d7f205" stroke="#08111f" stroke-width="1.5"/>
  </svg>`;
}

// наборы вопросов: переключатель сверху и на экране итога
const chips = () => `<div class="chips">${Object.entries(SETS).map(([k, v]) => `<button data-set="${k}" class="${set === k ? 'on' : ''}">${v[0]}</button>`).join('')}</div>`;
app.addEventListener('click', e => { const b = e.target.closest('[data-set]'); if (b && !busy) { set = b.dataset.set; Q = SETS[set][1]; restart(); } });

function render() {
  if (qi >= Q.length) return final();
  const c = Q[qi];
  app.innerHTML = `${chips()}
    <div class="qtop"><div class="dots">${Q.map((_, i) => `<i class="${i < answers.length ? 'g' + answers[i] : i === qi ? 'now' : ''}"></i>`).join('')}</div>
      <div class="pts">${score}</div><button class="vbtn" id="vbtn">${Voice.on ? '🔊' : '🔇'}</button></div>
    <div class="kind">${c.k} · ${qi + 1}/${Q.length}</div>
    <div class="q">${c.q}</div>
    <div class="courtq">${court(c)}</div>
    <div class="opts">${c.opts.map((o, i) => `<button data-o="${i}"><b>${'АБВ'[i]}</b>${o.t}</button>`).join('')}</div>
    <div id="after"></div>`;
  document.getElementById('vbtn').onclick = () => { Voice.on = !Voice.on; render(); };
  app.querySelector('.opts').onclick = e => { const b = e.target.closest('[data-o]'); if (b && !busy) pick(+b.dataset.o); };
  Voice.say(`${c.k} ${c.q} ${c.opts.map((o, i) => `${'АБВ'[i]}: ${o.t}.`).join(' ')}`);
}

// анимация мяча (или игрока) по траектории; h — высота дуги: мяч растёт, тень остаётся на полу
function fly(segs, who) {
  return segs.reduce((pr, sg) => pr.then(() => new Promise(res => {
    const svg = document.getElementById('cq'), ns = 'http://www.w3.org/2000/svg';
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', sg.d); path.setAttribute('fill', 'none'); path.setAttribute('stroke', '#d7f205');
    path.setAttribute('stroke-width', '2.5'); path.setAttribute('stroke-dasharray', '5 6'); path.setAttribute('opacity', '.8');
    document.getElementById('trail').appendChild(path);
    const L = path.getTotalLength(), dur = Math.max(450, L * 3.2), t0 = performance.now();
    const ball = document.getElementById('ball'), sh = document.getElementById('shadow'), me = who && document.getElementById('p' + who.toUpperCase());
    (function step(now) {
      const t = Math.min(1, (now - t0) / dur), pt = path.getPointAtLength(L * t);
      if (who) me.setAttribute('transform', `translate(${pt.x} ${pt.y})`);
      else {
        const lift = Math.sin(Math.PI * t) * (sg.h || 0);
        ball.setAttribute('cx', pt.x); ball.setAttribute('cy', pt.y - lift * 22); ball.setAttribute('r', 6 + lift * 5);
        sh.setAttribute('cx', pt.x); sh.setAttribute('cy', pt.y);
      }
      t < 1 ? requestAnimationFrame(step) : res();
    })(t0);
  })), Promise.resolve());
}

async function pick(i) {
  busy = true;
  const c = Q[qi], o = c.opts[i];
  const btns = [...app.querySelectorAll('.opts button')];
  btns.forEach((b, k) => { b.disabled = true; if (k === i) b.classList.add('picked', 'g' + o.g); else if (c.opts[k].g === 2) b.classList.add('g2'); else b.classList.add('dim'); });
  answers.push(o.g); score += GR[o.g][1];
  const best = c.opts.find(x => x.g === 2);
  const text = o.g === 2 ? o.r : `${o.r} Лучше: ${best.t.toLowerCase()}.`;
  Voice.say(`${GR[o.g][0]} ${text}`);
  await fly(c.truth || [{ d:o.d, h:o.h }], o.who);
  document.getElementById('after').innerHTML = `<div class="verdict g${o.g}"><h3>${GR[o.g][0]}</h3><p>${text}</p>${c.src ? `<a class="src" href="https://youtu.be/${c.src}" target="_blank" rel="noopener">▶ ${VID[c.src]}</a>` : ''}</div>
    <button class="primary nextq" id="nextq">${qi + 1 < Q.length ? 'Дальше →' : 'Итог'}</button>`;
  document.querySelector('.qtop .pts').textContent = score;
  document.getElementById('nextq').onclick = () => { qi++; busy = false; render(); window.scrollTo({ top:0, behavior:'smooth' }); };
  document.getElementById('nextq').scrollIntoView({ behavior:'smooth', block:'end' });
}

function final() {
  const max = Q.length, pct = score / max;
  const msg = pct >= .85 ? 'Тактик! Можно на турнир.' : pct >= .6 ? 'Крепко. Пара решений — и будет огонь.' : 'Есть над чем поработать — загляни в Академию.';
  app.innerHTML = `${chips()}<div class="final"><div class="kind">Твой результат</div><div class="big">${score}/${max}</div><p>${msg}</p>
    <div class="dots" style="margin:18px 0">${answers.map(g => `<i class="g${g}"></i>`).join('')}</div>
    <button class="primary nextq" id="again">Ещё раз</button><a class="nextq" href="academy.html" style="display:block;text-align:center;color:var(--ball);font-weight:800;text-decoration:none">В Академию →</a></div>`;
  Voice.say(`Результат: ${String(score).replace('.', ',')} из ${max}. ${msg}`);
  document.getElementById('again').onclick = restart;
}
function restart() { qi = 0; score = 0; answers = []; busy = false; render(); }
render();
</script>
</body>
</html>
